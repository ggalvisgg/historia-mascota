services:
# --------------------------------------------------------------------
  # - fastapi refers to the container where the application backend will be stored.
  springboot:
    build: 
      context: ./build
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "8090:8090"
    networks:
      - net_eam_database
# --------------------------------------------------------------------

networks:
  net_eam_database:
      driver: bridge
      name: net_eam_database
